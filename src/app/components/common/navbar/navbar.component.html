<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
        <a class="navbar-brand" (click)="goHome($event)" style="cursor: pointer;">
            <img src="assets/img/CangrejoSinFondo.png" alt="Cangrejo Azul - Movimiento de Conservación" class="brand-logo">
        </a>
    
        <div class="collapse navbar-collapse" id="navbarSupportedContent" [class.show]="!isCollapsed">
            <ul class="navbar-nav">
                <li class="nav-item" *ngFor="let navItem of navItems">
                    <a *ngIf="navItem.title === 'Inicio'" (click)="goHome($event)" class="nav-link" style="cursor: pointer;">{{navItem.title}}</a>
                    <a *ngIf="navItem.title !== 'Inicio'" [routerLink]="[navItem.route]" class="nav-link">{{navItem.title}}</a>
                </li>
            </ul>
        </div>

        <!-- Contenedor de iconos en la esquina derecha -->
        <div class="navbar-right-icons">
            <button class="navbar-toggler" type="button" (click)="toggleNavbar()" [attr.aria-expanded]="!isCollapsed" aria-controls="navbarSupportedContent" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Icono de persona para iniciar sesión - cuando NO está autenticado -->
            <a *ngIf="!isAuthenticated" (click)="openAuthModal()" class="user-icon-btn" title="Iniciar sesión" style="cursor: pointer;">
                <i class="las la-user"></i>
            </a>
            
            <!-- Iniciales del usuario con menú desplegable - cuando SÍ está autenticado -->
            <div *ngIf="isAuthenticated" class="user-menu-container">
                <a (click)="toggleUserMenu($event)" class="user-initials-btn" [title]="currentUsername" style="cursor: pointer;">
                    <span class="user-initials">{{userInitials}}</span>
                </a>
                
                <!-- Menú desplegable -->
                <div class="user-dropdown-menu" *ngIf="showUserMenu" (click)="$event.stopPropagation()">
                    <div class="dropdown-header">
                        <div class="dropdown-user-info">
                            <div class="dropdown-user-avatar">
                                <span class="dropdown-initials">{{userInitials}}</span>
                            </div>
                            <div class="dropdown-user-details">
                                <div class="dropdown-username">{{currentUsername}}</div>
                                <div class="dropdown-user-email">{{currentUsername}}</div>
                            </div>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-items">
                        <a class="dropdown-item" (click)="closeUserMenu()">
                            <i class="las la-user"></i>
                            <span>Mi Perfil</span>
                        </a>
                        <a class="dropdown-item" (click)="closeUserMenu()">
                            <i class="las la-cog"></i>
                            <span>Configuración</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item logout-item" (click)="handleLogout()">
                            <i class="las la-sign-out-alt"></i>
                            <span>Cerrar Sesión</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Modal de Autenticación -->
<div class="auth-modal-overlay" *ngIf="showAuthModal" (click)="closeAuthModal($event)">
    <div class="auth-modal" (click)="$event.stopPropagation()">
        <!-- Botón cerrar -->
        <button class="modal-close-btn" (click)="closeAuthModal($event)">
            <i class="las la-times"></i>
        </button>

        <!-- Logo y título en el header azul -->
        <div class="modal-logo">
            <img src="assets/img/CangrejoSinFondo.png" alt="Cangrejo Azul">
            <p class="modal-invitation-text">Únete al movimiento y ayuda a proteger al Cangrejo Azul</p>
        </div>

        <!-- Tabs de navegación -->
        <div class="auth-tabs">
            <button 
                class="auth-tab" 
                [class.active]="authMode === 'login'"
                (click)="authMode = 'login'">
                <i class="las la-sign-in-alt"></i>
                Ingresar
            </button>
            <button 
                class="auth-tab" 
                [class.active]="authMode === 'register'"
                (click)="authMode = 'register'">
                <i class="las la-user-plus"></i>
                Registrarse
            </button>
        </div>

        <!-- Formulario de Login -->
        <form class="auth-form" *ngIf="authMode === 'login'" (ngSubmit)="onLoginSubmit()">
            <div class="form-group">
                <label for="loginUsername" class="form-label">
                    <i class="las la-user"></i>
                    Nombre de Usuario
                </label>
                <input 
                    type="text" 
                    id="loginUsername" 
                    class="form-control"
                    [(ngModel)]="loginForm.username"
                    name="loginUsername"
                    placeholder="Ingresa tu nombre de usuario"
                    required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="loginPassword" class="form-label">
                    <i class="las la-lock"></i>
                    Contraseña
                </label>
                <div class="password-wrapper">
                    <input 
                        [type]="showLoginPassword ? 'text' : 'password'" 
                        id="loginPassword" 
                        class="form-control"
                        [(ngModel)]="loginForm.password"
                        name="loginPassword"
                        placeholder="Ingresa tu contraseña"
                        required
                        autocomplete="current-password">
                    <button 
                        type="button" 
                        class="password-toggle"
                        (click)="showLoginPassword = !showLoginPassword">
                        <i [class]="showLoginPassword ? 'las la-eye-slash' : 'las la-eye'"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" [(ngModel)]="loginForm.rememberMe" name="rememberMe">
                    <span class="checkbox-custom"></span>
                    <span>Recordarme</span>
                </label>
            </div>

            <button type="submit" class="btn-submit" [disabled]="isSubmitting">
                <span *ngIf="!isSubmitting">
                    <i class="las la-sign-in-alt"></i>
                    Iniciar Sesión
                </span>
                <span *ngIf="isSubmitting">
                    <i class="las la-spinner la-spin"></i>
                    Iniciando...
                </span>
            </button>
        </form>

        <!-- Formulario de Registro -->
        <form class="auth-form" *ngIf="authMode === 'register'" (ngSubmit)="onRegisterSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label for="registerName" class="form-label">
                        <i class="las la-user"></i>
                        Nombre Completo
                    </label>
                    <input 
                        type="text" 
                        id="registerName" 
                        class="form-control"
                        [(ngModel)]="registerForm.name"
                        name="registerName"
                        placeholder="Tu nombre"
                        required>
                </div>

                <div class="form-group">
                    <label for="registerUsername" class="form-label">
                        <i class="las la-user-circle"></i>
                        Usuario
                    </label>
                    <input 
                        type="text" 
                        id="registerUsername" 
                        class="form-control"
                        [(ngModel)]="registerForm.username"
                        name="registerUsername"
                        placeholder="Nombre de usuario"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="registerEmail" class="form-label">
                    <i class="las la-envelope"></i>
                    Correo Electrónico
                </label>
                <input 
                    type="email" 
                    id="registerEmail" 
                    class="form-control"
                    [(ngModel)]="registerForm.email"
                    name="registerEmail"
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="registerPassword" class="form-label">
                        <i class="las la-lock"></i>
                        Contraseña
                    </label>
                    <div class="password-wrapper">
                        <input 
                            [type]="showRegisterPassword ? 'text' : 'password'" 
                            id="registerPassword" 
                            class="form-control"
                            [(ngModel)]="registerForm.password"
                            name="registerPassword"
                            placeholder="Mín. 8 caracteres"
                            required>
                        <button 
                            type="button" 
                            class="password-toggle"
                            (click)="showRegisterPassword = !showRegisterPassword">
                            <i [class]="showRegisterPassword ? 'las la-eye-slash' : 'las la-eye'"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerConfirmPassword" class="form-label">
                        <i class="las la-lock"></i>
                        Confirmar
                    </label>
                    <div class="password-wrapper">
                        <input 
                            [type]="showConfirmPassword ? 'text' : 'password'" 
                            id="registerConfirmPassword" 
                            class="form-control"
                            [(ngModel)]="registerForm.confirmPassword"
                            name="registerConfirmPassword"
                            placeholder="Repite contraseña"
                            required>
                        <button 
                            type="button" 
                            class="password-toggle"
                            (click)="showConfirmPassword = !showConfirmPassword">
                            <i [class]="showConfirmPassword ? 'las la-eye-slash' : 'las la-eye'"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" [(ngModel)]="registerForm.acceptTerms" name="acceptTerms" required>
                    <span class="checkbox-custom"></span>
                    <span class="terms-text">Acepto los términos y condiciones</span>
                </label>
            </div>

            <button type="submit" class="btn-submit" [disabled]="isSubmitting">
                <span *ngIf="!isSubmitting">
                    <i class="las la-user-plus"></i>
                    Crear Cuenta
                </span>
                <span *ngIf="isSubmitting">
                    <i class="las la-spinner la-spin"></i>
                    Registrando...
                </span>
            </button>
        </form>
    </div>
</div>
